<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M12345678 Mediapipe Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #05060f;
    overflow: hidden;
    font-family: "Segoe UI", "Microsoft JhengHei", sans-serif;
    color: #fff;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }

  /* Particle canvas: full-screen background on top */
  #particleCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    z-index: 2;
    pointer-events: none;
  }

  /* Live camera feed + detection overlay (picture-in-picture, bottom right) */
  #camWrap {
    position: absolute;
    right: 20px; bottom: 20px;
    width: 420px;
    aspect-ratio: 4 / 3;
    border: 2px solid rgba(0, 255, 220, .6);
    border-radius: 12px;
    overflow: hidden;
    z-index: 5;
    box-shadow: 0 0 24px rgba(0, 255, 220, .35);
    background: #000;
  }
  #video, #overlayCanvas {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scaleX(-1);   /* mirrored for a more intuitive view */
  }
  #overlayCanvas { z-index: 2; }

  /* Title bar */
  #titleBar {
    position: absolute;
    top: 0; left: 0; right: 0;
    text-align: center;
    padding: 14px 0 10px;
    z-index: 10;
    background: linear-gradient(180deg, rgba(5,6,15,.85), transparent);
  }
  #titleBar h1 {
    font-size: 44px;
    font-weight: 900;
    letter-spacing: 6px;
    background: linear-gradient(90deg, #00ffd0, #6a8dff, #ff6ad5, #ffd166, #00ffd0);
    background-size: 300% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: flow 8s linear infinite;
    text-shadow: 0 0 30px rgba(106, 141, 255, .25);
  }
  @keyframes flow { to { background-position: 300% 0; } }

  /* Left-side info panel */
  #infoPanel {
    position: absolute;
    left: 20px; bottom: 20px;
    z-index: 10;
    background: rgba(10, 14, 30, .72);
    border: 1px solid rgba(120, 160, 255, .35);
    border-radius: 12px;
    padding: 16px 20px;
    min-width: 300px;
    backdrop-filter: blur(6px);
    line-height: 1.9;
    font-size: 15px;
  }
  #infoPanel .clock { font-size: 26px; font-weight: 700; color: #00ffd0; }
  #infoPanel .date  { font-size: 17px; color: #9fb4ff; }
  #infoPanel .row b { color: #ffd166; }
  #handState.open   { color: #00ff88; font-weight: 700; }
  #handState.closed { color: #ff5f7a; font-weight: 700; }
  #handState.none   { color: #888; }

  .bar {
    width: 100%; height: 8px;
    background: rgba(255,255,255,.12);
    border-radius: 4px;
    overflow: hidden;
    margin-top: 2px;
  }
  .bar > i {
    display: block; height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #00ffd0, #6a8dff);
    border-radius: 4px;
    transition: width .12s linear;
  }

  #loading {
    position: absolute; inset: 0;
    z-index: 99;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 16px;
    background: #05060f;
    font-size: 20px; letter-spacing: 2px;
  }
  .spinner {
    width: 52px; height: 52px;
    border: 4px solid rgba(0,255,208,.2);
    border-top-color: #00ffd0;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="stage">
  <canvas id="particleCanvas"></canvas>

  <div id="titleBar"><h1>M12345678 Mediapipe Demo</h1></div>

  <div id="camWrap">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlayCanvas"></canvas>
  </div>

  <div id="infoPanel">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="dateText">----/--/--</div>
    <div class="row">Right Hand: <span id="handState" class="none">Not Detected</span></div>
    <div class="row">Openness: <b id="openPct">--</b>
      <div class="bar"><i id="openBar"></i></div>
    </div>
    <div class="row">Distance to Screen: <b id="distText">--</b>
      <div class="bar"><i id="distBar"></i></div>
    </div>
    <div class="row">Shape: <b id="shapeText">Heart</b>&nbsp;&nbsp;Color: <b id="colorText">-</b></div>
    <div class="row" style="font-size:13px;color:#8899bb">Fist &rarr; Open switches shape &amp; color | Moving closer shrinks the particle range</div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loadingText">Loading AI models, please wait and allow camera access&hellip;</div>
  </div>
</div>

<script type="module">
import {
  FilesetResolver,
  HandLandmarker,
  PoseLandmarker
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

/* ============ DOM ============ */
const video          = document.getElementById("video");
const overlayCanvas  = document.getElementById("overlayCanvas");
const overlayCtx     = overlayCanvas.getContext("2d");
const particleCanvas = document.getElementById("particleCanvas");
const pCtx           = particleCanvas.getContext("2d");
const loadingEl      = document.getElementById("loading");
const loadingTextEl  = document.getElementById("loadingText");

const clockEl   = document.getElementById("clock");
const dateEl    = document.getElementById("dateText");
const handEl    = document.getElementById("handState");
const openPctEl = document.getElementById("openPct");
const openBarEl = document.getElementById("openBar");
const distEl    = document.getElementById("distText");
const distBarEl = document.getElementById("distBar");
const shapeEl   = document.getElementById("shapeText");
const colorEl   = document.getElementById("colorText");

function resize() {
  particleCanvas.width  = innerWidth;
  particleCanvas.height = innerHeight;
}
addEventListener("resize", resize);
resize();

/* ============ Clock ============ */
const WEEK = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
function tickClock() {
  const n = new Date();
  clockEl.textContent = n.toLocaleTimeString("en-US", { hour12: false });
  const y = n.getFullYear();
  const m = String(n.getMonth() + 1).padStart(2, "0");
  const d = String(n.getDate()).padStart(2, "0");
  dateEl.textContent = `${y}-${m}-${d} ${WEEK[n.getDay()]}`;
}
setInterval(tickClock, 500);
tickClock();

/* ============ Shape definitions (return unit coordinates -1..1) ============ */
function heartPoint(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13*Math.cos(t) - 5*Math.cos(2*t) - 2*Math.cos(3*t) - Math.cos(4*t);
  return { x: x/17, y: -y/17 };
}
function starPoint(t) {
  const spikes = 5, outer = 1, inner = 0.42;
  const seg = (t / (Math.PI*2)) * spikes * 2;
  const i = Math.floor(seg), frac = seg - i;
  const r1 = (i % 2 === 0) ? outer : inner;
  const r2 = (i % 2 === 0) ? inner : outer;
  const a1 = (i    / (spikes*2)) * Math.PI*2 - Math.PI/2;
  const a2 = ((i+1)/ (spikes*2)) * Math.PI*2 - Math.PI/2;
  const x = r1*Math.cos(a1) + (r2*Math.cos(a2) - r1*Math.cos(a1))*frac;
  const y = r1*Math.sin(a1) + (r2*Math.sin(a2) - r1*Math.sin(a1))*frac;
  return { x, y };
}
function flowerPoint(t) {          // five-petal flower (rose curve)
  const r = Math.abs(Math.cos(2.5 * t));
  return { x: r*Math.cos(t), y: r*Math.sin(t) };
}
function butterflyPoint(t) {       // butterfly curve
  const s = t * 6;                 // needs a longer parameter domain
  const r = Math.exp(Math.sin(s)) - 2*Math.cos(4*s) + Math.pow(Math.sin((2*s - Math.PI)/24), 5);
  return { x: r*Math.sin(s)/4, y: -r*Math.cos(s)/4 + 0.15 };
}
function spiralPoint(t) {          // three-turn spiral
  const turns = 3;
  const a = t * turns;
  const r = t / (Math.PI*2);
  return { x: r*Math.cos(a), y: r*Math.sin(a) };
}

const SHAPES = [
  { name: "Heart",     fn: heartPoint },
  { name: "Star",      fn: starPoint },
  { name: "Flower",    fn: flowerPoint },
  { name: "Butterfly", fn: butterflyPoint },
  { name: "Spiral",    fn: spiralPoint },
];

/* Distinct color pairs (primary / secondary) */
const PALETTES = [
  { name: "Red",     a: "#ff2d55", b: "#ff9500" },
  { name: "Teal",    a: "#00ffa8", b: "#00ccff" },
  { name: "Blue",    a: "#3a7bff", b: "#9d6bff" },
  { name: "Gold",    a: "#ffd60a", b: "#ff7b00" },
  { name: "Magenta", a: "#ff2dcb", b: "#7a5cff" },
  { name: "White",   a: "#ffffff", b: "#9adcff" },
];

/* ============ Particle system ============ */
const N = 4000;
const particles = [];
for (let i = 0; i < N; i++) {
  particles.push({
    x: Math.random()*innerWidth,
    y: Math.random()*innerHeight,
    vx: 0, vy: 0,
    t: (i / N) * Math.PI * 2,          // shape parameter
    jx: (Math.random()-0.5),           // random scatter direction
    jy: (Math.random()-0.5),
    size: 1.5 + Math.random()*2.5,
    tw: Math.random()*Math.PI*2,       // twinkle phase
  });
}

let shapeIdx = 0;
let paletteIdx = 0;
let openness = 0.5;        // 0=fist 1=fully open (smoothed)
let rawOpenness = 0.5;
let distScale = 1.0;       // overall scale from distance (smoothed)
let rawDistScale = 1.0;
let handDetected = false;
let wasClosed = false;

function applyShape() {
  shapeEl.textContent = SHAPES[shapeIdx].name;
  const p = PALETTES[paletteIdx];
  colorEl.textContent = p.name;
  colorEl.style.color = p.a;
}
applyShape();

function drawParticles() {
  const W = particleCanvas.width, H = particleCanvas.height;
  pCtx.clearRect(0, 0, W, H);

  // smoothing
  openness  += (rawOpenness  - openness)  * 0.12;
  distScale += (rawDistScale - distScale) * 0.08;

  const cx = W/2, cy = H/2 + 20;
  const baseR = Math.min(W, H) * 0.52 * distScale;
  // shrinks to 8% on a fist, 100% + extra scatter when fully open (may fly off-screen)
  const scale = baseR * (0.08 + 0.92 * openness);
  const scatter = Math.max(0, openness - 0.55) * baseR * 6.0;  // bursts outward near fully open

  const pal = PALETTES[paletteIdx];
  const shapeFn = SHAPES[shapeIdx].fn;
  const time = performance.now() / 1000;

  pCtx.globalCompositeOperation = "lighter";
  for (const p of particles) {
    const pt = shapeFn(p.t);
    const tx = cx + pt.x * scale + p.jx * scatter;
    const ty = cy + pt.y * scale + p.jy * scatter;
    // spring-follow
    p.vx = (p.vx + (tx - p.x) * 0.045) * 0.86;
    p.vy = (p.vy + (ty - p.y) * 0.045) * 0.86;
    p.x += p.vx;
    p.y += p.vy;

    const twinkle = 0.55 + 0.45 * Math.sin(time*3 + p.tw);
    pCtx.globalAlpha = twinkle * (0.35 + 0.65*openness);
    pCtx.fillStyle = (p.t % (Math.PI/2) < Math.PI/4) ? pal.a : pal.b;
    pCtx.beginPath();
    pCtx.arc(p.x, p.y, p.size * (0.6 + 0.6*openness), 0, Math.PI*2);
    pCtx.fill();
  }
  pCtx.globalAlpha = 1;
  pCtx.globalCompositeOperation = "source-over";
}

/* ============ MediaPipe ============ */
let handLandmarker, poseLandmarker;

async function init() {
  // Start the models (network download + WASM init) and the camera permission
  // prompt at the same time instead of one after another. getUserMedia's
  // permission dialog and device startup don't need the models to be ready,
  // so running them in parallel noticeably cuts the time to first frame.
  const modelsPromise = (async () => {
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    return Promise.all([
      HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numHands: 2
      }),
      PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "GPU"
        },
        runningMode: "VIDEO",
        numPoses: 1
      })
    ]);
  })();

  const cameraPromise = navigator.mediaDevices.getUserMedia({
    video: { width: 640, height: 480 }, audio: false
  });

  const [[hl, pl], stream] = await Promise.all([modelsPromise, cameraPromise]);
  handLandmarker = hl;
  poseLandmarker = pl;

  video.srcObject = stream;
  await new Promise(r => video.onloadeddata = r);
  overlayCanvas.width  = video.videoWidth;
  overlayCanvas.height = video.videoHeight;

  loadingEl.style.display = "none";
  requestAnimationFrame(loop);
}

function dist2D(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

/* ============ Neon-style skeleton drawing ============ */
function px(lm) {
  return { x: lm.x * overlayCanvas.width, y: lm.y * overlayCanvas.height };
}

/* Glowing line: outer halo + inner bright core */
function glowLine(ctx, a, b, color, width) {
  ctx.save();
  ctx.lineCap = "round";
  ctx.shadowColor = color;
  ctx.shadowBlur = 14;
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = "rgba(255,255,255,.85)";
  ctx.lineWidth = Math.max(1, width * 0.35);
  ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  ctx.restore();
}

/* Glowing joint dot: halo circle + white bright core */
function glowDot(ctx, p, color, r) {
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r * 2.6);
  g.addColorStop(0, color);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffffff";
  ctx.beginPath(); ctx.arc(p.x, p.y, r * 0.55, 0, Math.PI * 2); ctx.fill();
}

/* Body skeleton: colored by body part (torso gold, arms cyan, legs purple, face pink) */
const POSE_COLOR_OF = i =>
  i <= 10 ? "#ff8fd8" :                       // face
  (i === 11 || i === 12 || i === 23 || i === 24) ? "#ffd166" : // torso endpoints
  (i <= 22) ? "#00e5ff" :                     // arms/hands
  "#b388ff";                                  // legs/feet

function drawPoseGlow(lm) {
  const ctx = overlayCtx;
  for (const c of PoseLandmarker.POSE_CONNECTIONS) {
    const a = lm[c.start], b = lm[c.end];
    if (a.visibility < 0.5 || b.visibility < 0.5) continue;
    const pa = px(a), pb = px(b);
    // gradient between the two endpoint colors
    const grad = ctx.createLinearGradient(pa.x, pa.y, pb.x, pb.y);
    grad.addColorStop(0, POSE_COLOR_OF(c.start));
    grad.addColorStop(1, POSE_COLOR_OF(c.end));
    glowLine(ctx, pa, pb, POSE_COLOR_OF(c.end), 4);
    ctx.save();
    ctx.strokeStyle = grad; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.globalAlpha = 0.7;
    ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
    ctx.restore();
  }
  for (let i = 0; i < lm.length; i++) {
    if (i > 10 && lm[i].visibility < 0.5) continue;
    if (i > 0 && i <= 10) continue;           // only keep the nose tip on the face, to avoid clutter
    glowDot(overlayCtx, px(lm[i]), POSE_COLOR_OF(i), i === 0 ? 6 : 4.5);
  }
}

/* Hands: each finger its own color, right hand in bright colors, left hand gray-blue */
const FINGER_COLORS = ["#ff5f7a", "#ffd166", "#06f7a1", "#4cc9f0", "#c77dff"];
function fingerOf(i) {
  if (i >= 1  && i <= 4)  return 0;   // thumb
  if (i >= 5  && i <= 8)  return 1;   // index
  if (i >= 9  && i <= 12) return 2;   // middle
  if (i >= 13 && i <= 16) return 3;   // ring
  if (i >= 17 && i <= 20) return 4;   // pinky
  return -1;                          // wrist/palm
}

function drawHandGlow(lm, isRight) {
  const ctx = overlayCtx;
  for (const c of HandLandmarker.HAND_CONNECTIONS) {
    const f = Math.max(fingerOf(c.start), fingerOf(c.end));
    const color = !isRight ? "#7a8ba8"
      : (f >= 0 ? FINGER_COLORS[f] : "#ffffff");
    glowLine(ctx, px(lm[c.start]), px(lm[c.end]), color, isRight ? 4 : 3);
  }
  for (let i = 0; i < lm.length; i++) {
    const f = fingerOf(i);
    const color = !isRight ? "#9fb0c8"
      : (f >= 0 ? FINGER_COLORS[f] : "#ffffff");
    // enlarge fingertip dots so they stand out
    const tip = (i === 4 || i === 8 || i === 12 || i === 16 || i === 20);
    glowDot(ctx, px(lm[i]), color, tip ? 6 : 4);
  }
  if (isRight) {
    // right-hand label
    const w = px(lm[0]);
    ctx.save();
    ctx.font = "bold 16px 'Microsoft JhengHei', sans-serif";
    ctx.shadowColor = "#00ff88"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#00ff88";
    ctx.scale(-1, 1);   // cancel out the CSS mirror so the text isn't reversed
    ctx.fillText("Control Hand R", -w.x - 120, w.y + 28);
    ctx.restore();
  }
}

/* Openness of the hand: average fingertip-to-wrist distance / palm reference length */
function computeOpenness(lm) {
  const wrist = lm[0];
  const palmLen = dist2D(wrist, lm[9]) || 1e-6;   // wrist -> middle finger base
  const tips = [4, 8, 12, 16, 20];
  let sum = 0;
  for (const i of tips) sum += dist2D(wrist, lm[i]);
  const ratio = (sum / tips.length) / palmLen;
  // ~0.9 for a fist, ~1.9 fully open -> mapped to 0..1
  return Math.min(1, Math.max(0, (ratio - 1.0) / 0.85));
}

let lastVideoTime = -1;

function loop() {
  requestAnimationFrame(loop);
  if (video.currentTime === lastVideoTime) { drawParticles(); return; }
  lastVideoTime = video.currentTime;
  const nowMs = performance.now();

  const handRes = handLandmarker.detectForVideo(video, nowMs);
  const poseRes = poseLandmarker.detectForVideo(video, nowMs);

  /* --- draw detection results on top of the camera feed --- */
  overlayCtx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);

  if (poseRes.landmarks) {
    for (const lm of poseRes.landmarks) drawPoseGlow(lm);
  }

  /* --- find the right hand (the image isn't mirrored, so the user's right hand is labeled "Left") --- */
  let rightHand = null;
  if (handRes.landmarks && handRes.landmarks.length) {
    for (let i = 0; i < handRes.landmarks.length; i++) {
      const label = handRes.handednesses?.[i]?.[0]?.categoryName;
      const isRight = (label === "Left");
      drawHandGlow(handRes.landmarks[i], isRight);
      if (isRight) rightHand = handRes.landmarks[i];
    }
    // if only one hand is seen and it wasn't labeled right, use it anyway to avoid flicker at the detection boundary
    if (!rightHand && handRes.landmarks.length === 1) rightHand = handRes.landmarks[0];
  }

  if (rightHand) {
    handDetected = true;
    rawOpenness = computeOpenness(rightHand);

    /* distance estimate: the larger the hand appears, the closer to the camera -> smaller particle range */
    const handSize = dist2D(rightHand[0], rightHand[9]);   // 0.04(far) ~ 0.30(near)
    const near = Math.min(1, Math.max(0, (handSize - 0.05) / 0.22)); // 0=far 1=near
    rawDistScale = 1.6 - near * 1.3;   // far: 1.6x -> near: 0.3x

    /* fist -> open transition: switch shape + color */
    const isClosed = rawOpenness < 0.25;
    const isOpen   = rawOpenness > 0.65;
    if (isClosed) wasClosed = true;
    if (wasClosed && isOpen) {
      wasClosed = false;
      shapeIdx   = (shapeIdx + 1) % SHAPES.length;
      paletteIdx = (paletteIdx + 1) % PALETTES.length;
      applyShape();
    }

    /* update the info panel */
    if (isClosed) {
      handEl.textContent = "✊ Fist";
      handEl.className = "closed";
    } else if (isOpen) {
      handEl.textContent = "🖐 Open";
      handEl.className = "open";
    } else {
      handEl.textContent = "🤏 Half Open";
      handEl.className = "open";
    }
    openPctEl.textContent = Math.round(rawOpenness*100) + "%";
    openBarEl.style.width = (rawOpenness*100) + "%";
    distEl.textContent = near > 0.66 ? "Near" : near > 0.33 ? "Mid" : "Far";
    distBarEl.style.width = (near*100) + "%";
  } else {
    handDetected = false;
    handEl.textContent = "Not Detected";
    handEl.className = "none";
  }

  drawParticles();
}

init().catch(err => {
  loadingEl.innerHTML = `<div style="color:#ff5f7a;max-width:600px;text-align:center;line-height:1.8">
    Initialization failed: ${err.message}<br>
    Please make sure camera access is allowed, and open this page via http(s) or localhost (file:// cannot access the camera).
  </div>`;
  console.error(err);
});
</script>
</body>
</html>
